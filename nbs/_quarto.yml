project:
  type: website
  output-dir: _docs
  preview: 
    port: 3000
    browser: false
  render:
    - index.ipynb
    - data_creation-revision.ipynb
    - dataset_conversion.ipynb
    - inference.ipynb
    
format:
  html:
    theme: syke.scss
    toc: true
    page-layout: full
    
website:
  title: "Mapping recreational marine traffic from Sentinel-2 imagery using YOLO object detection models"
  description: "Mapping recreational marine traffic from Sentinel-2 imagery using YOLO object detection models"
  open-graph: true
  reader-mode: true
  repo-branch: main
  repo-subdir: nbs
  repo-url: https://github.com/mayrajeo/ship-detection
  repo-actions: [source]
  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: https://github.com/mayrajeo/ship-detection
  sidebar:
    style: "floating"
    contents:
      - text: Introduction
        file: index.ipynb
      - data_creation-revision.ipynb
      - dataset_conversion.ipynb
      - inference.ipynb
  page-navigation: true